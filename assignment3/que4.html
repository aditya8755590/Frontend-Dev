<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<!-- Q4: Frameset with top navigation and bottom welcome message -->
<html>
  <head>
    <title>Q4 - Frameset Layout</title>
  </head>
  <frameset rows="80,*">
    <frame name="top" srcdoc="<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Nav</title></head><body><p><a href='#'>Home</a> | <a href='#'>About</a> | <a href='#'>Contact</a></p></body></html>">
    <frame name="bottom" srcdoc="<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Welcome</title></head><body><h2>Welcome to My Website</h2></body></html>">
    <noframes>
      <body>Your browser does not support frames.</body>
    </noframes>
  </frameset>
</html>
