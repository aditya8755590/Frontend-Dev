<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Q8 - Feedback Form</title>
  </head>
  <body>
    <h1>Your Feedback</h1>
    <form action="#" method="post">
      <p>
        <label for="fb">Feedback:</label><br>
        <textarea id="fb" name="fb" rows="5" cols="40"></textarea>
      </p>
      <p>Rate us:</p>
      <p>
        <label><input type="radio" name="rating" value="good"> Good</label>
        <label><input type="radio" name="rating" value="average"> Average</label>
        <label><input type="radio" name="rating" value="poor"> Poor</label>
      </p>
      <p>
        <button type="submit">Submit</button>
      </p>
    </form>
  </body>
</html>
