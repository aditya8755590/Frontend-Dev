<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Q3 - Two Iframes</title>
  </head>
  <body>
    <h1>My Pages in Iframes</h1>
    <iframe
      title="My Introduction"
      width="100%"
      height="200"
      srcdoc="<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><title>Intro</title></head><body><h2>Introduction</h2><p>Hello, I am Aditya. I am learning HTML.</p></body></html>">
    </iframe>
    <iframe
      title="My Hobby"
      width="100%"
      height="220"
      srcdoc="<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><title>Hobby</title></head><body><h2>My Hobby</h2><p>I like reading books and coding simple pages.</p></body></html>">
    </iframe>
  </body>
</html>
