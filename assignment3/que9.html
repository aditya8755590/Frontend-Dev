<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Q9 - Image Upload</title>
  </head>
  <body>
    <h1>Upload Your Image</h1>
    <form action="#" method="post" enctype="multipart/form-data">
      <p>
        <label for="img">Choose a file:</label>
        <input id="img" name="img" type="file" accept=".jpg,.jpeg,.png" required>
      </p>
      <p>Allowed files: JPG or PNG images only.</p>
      <p>
        <button type="submit">Upload</button>
      </p>
    </form>
  </body>
</html>
