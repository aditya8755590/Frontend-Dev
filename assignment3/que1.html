<!DOCTYPE html>
<!-- Q1: YouTube video with responsive percentage width/height (HTML only) -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Q1 - YouTube Video (Responsive)</title>
</head>

<body>
  <h1>My Favorite Video</h1>
  <iframe width="100%" height="600px" src="https://www.youtube.com/embed/1Vq8EjnWTNE?si=ZpICpYbcGRz1d9F7"
    title="YouTube video player" frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>

</html>
