<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q7 – Contact Form</title>
  <link rel="stylesheet" href="que7.css">
</head>
<body>
  <main class="center">

    <form class="box" action="#" method="post">
      <h1>Contact</h1>
      <label>Name
        <input type="text" required>
      </label>
      <label>Email
        <input type="email" required>
      </label>
      <label>Subject
        <input type="text" required>
      </label>
      <label>Message
        <textarea rows="5" required></textarea>
      </label>
      <button type="submit">Send</button>
    </form>
    
  </main>
</body>
</html>
