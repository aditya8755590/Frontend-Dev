<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q10 – Complete Layout</title>
  <link rel="stylesheet" href="que10.css">
</head>
<body>
  <header class="stick">
    <nav class="nav">
      <a href="#hero">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="hero" class="hero">
    <div class="center">
      <h1>Welcome</h1>
      <p>Simple box model demo</p>
    </div>
    <div class="badge">New</div>
    <div class="fixed">Note</div>
  </section>

  <section id="about" class="about">
    <div class="t">
      <h2>About</h2>
      <p>Two columns: text and image. Using margin, padding, border, outline and rgba.</p>
    </div>
    <img src="https://picsum.photos/seed/about/480/300" alt="">
  </section>

  <section id="services" class="services">
    <article class="svc">Design</article>
    <article class="svc best">Development</article>
    <article class="svc">Support</article>
  </section>

  <section id="contact" class="contact">
    <h2>Contact</h2>
    <form class="form" action="#" method="post">
      <input type="text" placeholder="Name" required>
      <input type="email" placeholder="Email" required>
      <textarea rows="4" placeholder="Message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer class="foot">&copy; 2025</footer>
</body>
</html>
