<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q2 - Personal Portfolio</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="q2.css">
</head>
<body>
<header class="bg-light border-bottom">
    <div class="container text-center py-4">
        <!-- text-center centers text; fw-bold makes it bold -->
        <h1 class="fw-bold mb-1">Aditya Kumar</h1>
        <p class="text-muted mb-0">Front-End Developer &amp; Problem Solver</p>
    </div>
</header>

<main>
    <section class="container text-center mt-4 mb-5">
        <img src="https://via.placeholder.com/160" alt="Profile photo" class="img-fluid rounded-circle mb-3">
        <p class="lead text-dark mb-4">I build responsive web interfaces, interactive dashboards, and fast prototypes using modern tools.</p>
        <div class="mb-4">
            <a href="#" class="btn btn-primary me-2">Hire Me</a>
            <a href="#" class="btn btn-outline-secondary">Download CV</a>
        </div>

        <section class="contact p-4 bg-light rounded shadow-sm mx-auto">
            <h2 class="h5 fw-semibold mb-3">Quick Contact</h2>
            <form>
                <!-- .form-control gives consistent input styling -->
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Your Name">
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Your Email">
                </div>
                <div class="mb-3">
                    <textarea class="form-control" rows="3" placeholder="Your Message"></textarea>
                </div>
                <button type="submit" class="btn btn-success">Send Message</button>
            </form>
        </section>
    </section>
</main>

<footer class="bg-dark text-white text-center py-3">
    <small>© 2025 Aditya Kumar. All rights reserved.</small>
</footer>

    <!-- Bootstrap 5 JS Bundle (for components like alerts, carousel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
