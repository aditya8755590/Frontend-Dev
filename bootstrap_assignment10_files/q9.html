<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q9 - Blog Pagination</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="q9.css">
</head>
<body>
<header class="bg-primary text-white py-4 mb-4">
    <div class="container">
        <h1 class="h3 mb-0">DevNotes Blog</h1>
    </div>
</header>

<main class="container mb-5">
    <section class="mb-4">
        <h2 class="h4">Recent Posts</h2>
        <p class="text-muted mb-0">Showing posts 1–10 of 24.</p>
    </section>

    <!-- Pagination component -->
    <nav aria-label="Blog page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item disabled">
                <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Previous</a>
            </li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item">
                <a class="page-link" href="#">Next</a>
            </li>
        </ul>
    </nav>

    <!-- Simple pager using buttons -->
    <section class="d-flex justify-content-between mt-4">
        <button class="btn btn-outline-secondary">&larr; Older Posts</button>
        <button class="btn btn-outline-secondary">Newer Posts &rarr;</button>
    </section>
</main>

<footer class="bg-light text-center py-3">
    <small>Navigate through pages to read more stories.</small>
</footer>

    <!-- Bootstrap 5 JS Bundle (for components like alerts, carousel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
