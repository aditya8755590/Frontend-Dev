<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q7 - Task Tracker with Badges</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="q7.css">
</head>
<body>
<header class="bg-primary text-white py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h1 class="h3 mb-0">Daily Task Tracker</h1>
            <small class="text-white-50">Stay on top of your work.</small>
        </div>
        <!-- Badge counter showing pending tasks -->
        <div>
            <span class="me-2">Pending tasks</span>
            <span class="badge bg-light text-primary fs-6">5</span>
        </div>
    </div>
</header>

<main class="container mb-5">
    <section class="row g-4">
        <div class="col-lg-8">
            <h2 class="h5 mb-3">Task List</h2>
            <!-- .list-group for tasks -->
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Finish Bootstrap assignment
                    <span class="badge bg-danger rounded-pill">High</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Review DSA notes
                    <span class="badge bg-warning text-dark rounded-pill">Medium</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Reply to project emails
                    <span class="badge bg-success rounded-pill">Low</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Plan weekend study schedule
                    <span class="badge bg-warning text-dark rounded-pill">Medium</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Backup code to GitHub
                    <span class="badge bg-success rounded-pill">Low</span>
                </li>
            </ul>
        </div>
        <div class="col-lg-4">
            <section class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h6 mb-3">Actions</h2>
                    <!-- Button with embedded badge -->
                    <button class="btn btn-success w-100 mb-2">
                        Mark Selected Completed
                        <span class="badge bg-light text-success ms-2">3</span>
                    </button>
                    <button class="btn btn-outline-secondary w-100">View Completed Tasks</button>
                </div>
            </section>
        </div>
    </section>
</main>

<footer class="bg-light text-center py-3">
    <small>Tip: Use badges to quickly scan priority levels.</small>
</footer>

    <!-- Bootstrap 5 JS Bundle (for components like alerts, carousel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
