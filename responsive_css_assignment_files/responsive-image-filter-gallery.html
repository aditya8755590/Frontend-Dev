<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
  <header class="site-header">
    <h1>Responsive Image Filter Gallery</h1>
    <p>Hover over the images to remove the filter effect.</p>
  </header>

  <main>
    <section class="gallery-section">
      <div class="gallery-grid">
        <figure class="gallery-item">
          <img src="https://via.placeholder.com/400x250?text=Image+1" alt="Mountain landscape with blur filter">
          <figcaption>Blur filter</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://via.placeholder.com/400x250?text=Image+2" alt="City street with grayscale filter">
          <figcaption>Grayscale filter</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://via.placeholder.com/400x250?text=Image+3" alt="Forest view with sepia filter">
          <figcaption>Sepia filter</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://via.placeholder.com/400x250?text=Image+4" alt="Beach photo with brightness filter">
          <figcaption>Brightness filter</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://via.placeholder.com/400x250?text=Image+5" alt="Skyline with contrast filter">
          <figcaption>Contrast filter</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://via.placeholder.com/400x250?text=Image+6" alt="Lake with hue-rotate filter">
          <figcaption>Hue-rotate filter</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Example gallery demonstrating CSS filters and responsive grid.</p>
  </footer>
</body>
</html>
