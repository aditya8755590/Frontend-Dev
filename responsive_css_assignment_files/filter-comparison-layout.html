<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
  <header class="site-header">
    <h1>Before &amp; After Filter Comparison</h1>
  </header>

  <main>
    <section class="comparison-section">
      <figure class="image-block">
        <img src="https://via.placeholder.com/600x350?text=Original+Image" alt="Original scenic view">
        <figcaption>Original photo</figcaption>
      </figure>
      <figure class="image-block filtered">
        <img src="https://via.placeholder.com/600x350?text=Filtered+Image" alt="Filtered scenic view">
        <figcaption>Edited photo with increased brightness</figcaption>
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    <p>Hover on the edited image to remove the filter.</p>
  </footer>
</body>
</html>
