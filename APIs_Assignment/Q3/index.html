<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q3 - Task Manager (jQuery AJAX)</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>body{font-family:Arial;padding:12px}.task{padding:8px;border-bottom:1px solid #eee}</style>
</head>
<body>
  <h3>Task Manager</h3>
  <label>Sort:
    <select id="filter">
      <option value="">--All--</option>
      <option value="priority=Low">Low Priority</option>
      <option value="priority=Medium">Medium Priority</option>
      <option value="priority=High">High Priority</option>
      <option value="completed=true">Completed</option>
    </select>
  </label>
  <div id="list"></div>

<script>
const API = "http://localhost:3004/tasks";
function load(q){
  let url = API;
  if(q) url += '?' + q;
  $.get(url, function(data){
    const el = $('#list').empty();
    data.forEach(t=>{
      const checked = t.completed ? 'checked' : '';
      el.append(`<div class="task"><input type="checkbox" data-id="${t.id}" ${checked}/> <strong>${t.title}</strong> - ${t.priority}</div>`);
    });
  }).fail(()=> $('#list').text('Failed to load tasks'));
}

$('#filter').on('change', function(){
  load(this.value);
});

$('#list').on('change','input[type=checkbox]', function(){
  const id = $(this).data('id');
  const done = this.checked;
  $.ajax({
    url: API + '/' + id,
    method: 'PATCH',
    contentType: 'application/json',
    data: JSON.stringify({ completed: done }),
    success: function(){},
    error: function(){ alert('Failed to update task'); }
  });
});

load();
</script>
</body>
</html>
