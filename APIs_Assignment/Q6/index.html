<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q6 - Registration (Axios)</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>body{font-family:Arial;padding:12px} label{display:block;margin:8px 0}</style>
</head>
<body>
  <h3>User Registration</h3>
  <form id="form">
    <label>Name <input name="name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <button type="submit">Register</button>
  </form>
  <div id="msg"></div>

<script>
const API = 'http://localhost:3007/users';
const form = document.getElementById('form');
const msg = document.getElementById('msg');

form.onsubmit = function(e){
  e.preventDefault();
  const formData = new FormData(form);
  const name = formData.get('name').trim();
  const email = formData.get('email').trim();
  msg.textContent = 'Checking...';

  axios.get(API + '?email=' + encodeURIComponent(email))
    .then(res=>{
      if(res.data && res.data.length){
        msg.textContent = 'Email already registered.';
      } else {
        return axios.post(API, { name, email });
      }
    })
    .then(res2=>{
      if(res2 && res2.data){
        msg.textContent = 'Registered successfully!';
        form.reset();
      }
    })
    .catch(err=>{
      msg.textContent = 'Error: ' + (err.message || 'Request failed');
    });
};
</script>
</body>
</html>
