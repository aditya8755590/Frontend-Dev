<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q2 - Tooltip Demonstration</title>
  <link rel="stylesheet" href="q2.css" />
</head>
<body>
  <header>
    <h1>CSS Tooltip Demonstration</h1>
  </header>

  <main>
    <section class="center-wrapper">
      <div class="tooltip-container">
        <span class="tooltip-target">HTML</span>
        <span class="tooltip-text">HyperText Markup Language</span>
      </div>

      <div class="tooltip-container">
        <span class="tooltip-target">CSS</span>
        <span class="tooltip-text">Cascading Style Sheets</span>
      </div>

      <div class="tooltip-container">
        <span class="tooltip-target">&#9432;</span>
        <span class="tooltip-text">Hover icons to see more info</span>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; Tooltip Demo Page</p>
  </footer>
</body>
</html>
