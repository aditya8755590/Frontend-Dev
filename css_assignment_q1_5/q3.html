<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - Image Showcase Layout</title>
  <link rel="stylesheet" href="q3.css" />
</head>
<body>
  <header>
    <h1>Image Showcase</h1>
  </header>

  <main>
    <section class="gallery">
      <figure class="gallery-item">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/400x250?text=Image+1" alt="Sample image 1" />
          <div class="overlay"></div>
        </div>
        <figcaption>Caption for image 1</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/400x250?text=Image+2" alt="Sample image 2" />
          <div class="overlay"></div>
        </div>
        <figcaption>Caption for image 2</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/400x250?text=Image+3" alt="Sample image 3" />
          <div class="overlay"></div>
        </div>
        <figcaption>Caption for image 3</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/400x250?text=Image+4" alt="Sample image 4" />
          <div class="overlay"></div>
        </div>
        <figcaption>Caption for image 4</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/400x250?text=Image+5" alt="Sample image 5" />
          <div class="overlay"></div>
        </div>
        <figcaption>Caption for image 5</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/400x250?text=Image+6" alt="Sample image 6" />
          <div class="overlay"></div>
        </div>
        <figcaption>Caption for image 6</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; Image Showcase Layout</p>
  </footer>
</body>
</html>
