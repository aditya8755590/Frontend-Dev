<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q2 - Live Character Counter</title>
  <link rel="stylesheet" href="q2.css" />
</head>
<body>
  <h1>Q2 - Live Character Counter</h1>
  <div class="container">
    <textarea id="message" rows="5" placeholder="Type here (max 100 characters)..."></textarea>
    <div class="controls">
      <span id="counter">Remaining: 100</span>
      <button id="resetBtn">Reset</button>
    </div>
  </div>
  <script src="q2.js"></script>
</body>
</html>
