<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q5 - Image Gallery Modal</title>
  <link rel="stylesheet" href="q5.css" />
</head>
<body>
  <h1>Q5 - Image Gallery with Modal</h1>
  <div class="gallery">
    <!-- You can replace these with your own image paths -->
    <img src="https://via.placeholder.com/150?text=1" data-full="https://via.placeholder.com/600?text=1" alt="Image 1" />
    <img src="https://via.placeholder.com/150?text=2" data-full="https://via.placeholder.com/600?text=2" alt="Image 2" />
    <img src="https://via.placeholder.com/150?text=3" data-full="https://via.placeholder.com/600?text=3" alt="Image 3" />
    <img src="https://via.placeholder.com/150?text=4" data-full="https://via.placeholder.com/600?text=4" alt="Image 4" />
    <img src="https://via.placeholder.com/150?text=5" data-full="https://via.placeholder.com/600?text=5" alt="Image 5" />
    <img src="https://via.placeholder.com/150?text=6" data-full="https://via.placeholder.com/600?text=6" alt="Image 6" />
  </div>

  <div id="modalOverlay" class="modal hidden">
    <div id="modalContent" class="modal-content">
      <img id="modalImage" src="" alt="Large preview" />
    </div>
  </div>

  <script src="q5.js"></script>
</body>
</html>
