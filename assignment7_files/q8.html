<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q8 - Custom Dropdown</title>
  <link rel="stylesheet" href="q8.css" />
</head>
<body>
  <h1>Q8 - Custom Dropdown</h1>
  <div id="dropdown" class="dropdown">
    <button id="dropdownBtn">Select an option</button>
    <div id="dropdownList" class="dropdown-list hidden">
      <div class="option">Option 1</div>
      <div class="option">Option 2</div>
      <div class="option">Option 3</div>
    </div>
  </div>

  <script src="q8.js"></script>
</body>
</html>
