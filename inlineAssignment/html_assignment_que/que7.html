<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Conference Schedule</title>
  </head>
  <body>
    <header>
      <h1>Web Dev Conference 2025</h1>
    </header>

    <main>
      <table border="1" title="Schedule Table">
        <caption>Day Plan</caption>
        <thead>
          <tr>
            <th>Session</th>
            <th>Time</th>
            <th>Topic</th>
            <th>Speaker</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td rowspan="2">Morning</td>
            <td>09:00 - 10:00</td>
            <td>HTML Basics</td>
            <td>Aditya</td>
          </tr>
          <tr>
            <td>10:15 - 11:15</td>
            <td>Forms & Tables</td>
            <td>Priya</td>
          </tr>
          <tr>
            <td>Afternoon</td>
            <td>02:00 - 03:00</td>
            <td>Accessibility Intro</td>
            <td>Rahul</td>
          </tr>
          <tr>
            <td>Evening</td>
            <td>04:00 - 05:00</td>
            <td>Q&A and Wrap-up</td>
            <td>Panel</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4">Note: Timings may change slightly.</td>
          </tr>
        </tfoot>
      </table>
    </main>

    <footer>
      <p>&copy; 2025 Web Dev Conf</p>
    </footer>
  </body>
</html>
