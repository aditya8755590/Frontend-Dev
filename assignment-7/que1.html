<!-- 1. Create a Borders and Padding Demonstration Page
Requirements:
● Display multiple boxes showing different border styles (solid,
dashed, double, groove).
● Add examples of rounded corners using border-radius.
● Use different padding values to demonstrate internal spacing.
● Align boxes horizontally using Flexbox.
● Apply a hover effect that changes the border color with a smooth
transition. -->
<body>
    <section>
       <section class="border-style">

        <div class="div" style="border: 2px solid black;"></div>
        <div class="div" style="border: 5px dashed black;"></div>
        <div class="div" style="border: 2px double black;"></div>
        <div class="div" style="border: 5px groove black;"></div>

       </section>
        <section class="border-style">
        <div class="div second" style="border-radius: 10px;"></div>
        <div class="div second" style="border-radius: 20px;"></div>
        <div class="div second" style="border-radius: 40px;"></div>
        <div class="div second" style="border-radius: 100px;"></div>
       </section>
       </section>
        <section class="border-style">
        <div class="demonstrate" style="padding: 20px;">
            <div class="internal"></div>
        </div>
        <div class="demonstrate" style="padding: 30px;">
            <div class="internal"></div>
        </div>
        <div class="demonstrate" style="padding: 40px;">
            <div class="internal"></div>
        </div>
        <div class="demonstrate" style="padding: 60px;">
            <div class="internal"></div>
        </div>
       </section>
       </section>
        <section class="border-style third-color">
        <div class="div second" ></div>
        <div class="div second"></div>
        <div class="div second" ></div>
        <div class="div second"></div>
       </section>

       <section class="border-style">

        <div class="div last"></div>
        <div class="div last"></div>
        <div class="div last"></div>
        <div class="div last"></div>

       </section>
    </section>
    
</body>
