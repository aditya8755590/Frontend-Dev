<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q4 - Special Offer Banner</title>
<link rel="stylesheet" href="style.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js" defer></script>
</head>
<body>
<header><h1>Special Offers</h1></header>
<main>
  <section id="banners">
    <div class="banner" data-index="1">Banner 1 — Big Sale! <button class="hide">Hide</button></div>
    <div class="banner" data-index="2">Banner 2 — Limited Time Offer <button class="hide">Hide</button></div>
    <div class="banner" data-index="3">Banner 3 — Free Shipping <button class="hide">Hide</button></div>
    <div class="banner" data-index="4">Banner 4 — New Arrivals <button class="hide">Hide</button></div>
    <div class="banner" data-index="5">Banner 5 — Member Discount <button class="hide">Hide</button></div>
  </section>

  <div id="controls">
    <button id="show-all">Show All</button>
    <button id="slide-toggle">Slide Up/Down</button>
    <button id="fade-toggle">Fade In/Out</button>
    <button id="start-rotate">Start Rotate</button>
    <button id="stop-rotate">Stop Rotate</button>
  </div>
</main>
<footer><small>Q4 — Banners demo</small></footer>
</body>
</html>
