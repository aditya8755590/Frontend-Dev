<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q2 - Product Highlight</title>
<link rel="stylesheet" href="style.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js" defer></script>
</head>
<body>
<header><h1>Shop</h1></header>
<main>
  <section id="products" aria-label="Product list">
    <article class="product" data-id="p1" data-stock="5" data-disc="10">
      <h2 class="title">Wireless Headphones</h2>
      <p class="price">₹1999 <span class="discount">-10%</span></p>
      <button class="fav" aria-pressed="false">☆ Favorite</button>
      <p class="details">Lightweight, 20h battery</p>
    </article>

    <article class="product" data-id="p2" data-stock="0" data-disc="0">
      <h2 class="title">Smart Watch</h2>
      <p class="price">₹3499</p>
      <button class="fav" aria-pressed="false">☆ Favorite</button>
      <p class="details">Water resistant, heart-rate</p>
    </article>

    <article class="product" data-id="p3" data-stock="12" data-disc="25">
      <h2 class="title">Bluetooth Speaker</h2>
      <p class="price">₹899 <span class="discount">-25%</span></p>
      <button class="fav" aria-pressed="false">☆ Favorite</button>
      <p class="details">Portable, deep bass</p>
    </article>

    <article class="product" data-id="p4" data-stock="2" data-disc="0">
      <h2 class="title">USB-C Charger</h2>
      <p class="price">₹499</p>
      <button class="fav" aria-pressed="false">☆ Favorite</button>
      <p class="details">Fast charging 30W</p>
    </article>

    <article class="product" data-id="p5" data-stock="8" data-disc="5">
      <h2 class="title">Laptop Sleeve</h2>
      <p class="price">₹699 <span class="discount">-5%</span></p>
      <button class="fav" aria-pressed="false">☆ Favorite</button>
      <p class="details">13-15 inch, water-resistant</p>
    </article>
  </section>
</main>
<footer><small>Q2 — Product interactions demo</small></footer>
</body>
</html>
