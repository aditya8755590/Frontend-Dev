<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q1 - Welcome Greeting</title>
<link rel="stylesheet" href="style.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js" defer></script>
</head>
<body>
<header>
  <h1>Welcome Site</h1>
  <p id="time-note">We greet based on time of day.</p>
</header>
<main>
  <section id="welcome-section" aria-live="polite">
    <h2 id="greeting">Hello!</h2>
    <p id="welcome-msg">We're glad you're here. This message can be toggled.</p>
    <button id="change-greeting">Change Greeting</button>
    <button id="toggle-message">Toggle Welcome Message</button>
    <button id="show-time">Show Current Time</button>
    <ul id="quick-links">
      <li><a href="#">Profile</a></li>
      <li><a href="#">Dashboard</a></li>
      <li><a href="#">Settings</a></li>
      <li><a href="#">Help</a></li>
      <li><a href="#">Logout</a></li>
    </ul>
  </section>
</main>
<footer>
  <small>Q1 — Demo with jQuery</small>
</footer>
</body>
</html>
