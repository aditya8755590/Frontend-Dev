<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q7 - Search Courses</title>
<link rel="stylesheet" href="style.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js" defer></script>
</head>
<body>
<header><h1>Courses</h1></header>
<main>
  <section id="search-panel">
    <input id="search" placeholder="Search courses...">
    <button id="clear">Clear</button>
    <div id="count">Matched: <span id="matched">0</span></div>
    <ul id="courses">
      <li class="course">JavaScript Basics</li>
      <li class="course">Advanced CSS</li>
      <li class="course">React for Beginners</li>
      <li class="course">Data Structures in Java</li>
      <li class="course">Database Design</li>
      <li class="course">Algorithms - Sorting</li>
      <li class="course">Web Security Essentials</li>
    </ul>
  </section>
</main>
<footer><small>Q7 — Search and filter demo</small></footer>
</body>
</html>
