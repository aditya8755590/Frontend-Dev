<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q3 - Interactive FAQ</title>
<link rel="stylesheet" href="style.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js" defer></script>
</head>
<body>
<header><h1>FAQ</h1></header>
<main>
  <section id="faq" aria-label="Frequently asked questions">
    <div class="faq-item">
      <button class="question">What is the return policy?</button>
      <div class="answer"><p>Returns accepted within 14 days with receipt.</p><input placeholder="Type a follow-up question"></div>
    </div>
    <div class="faq-item">
      <button class="question">How long is shipping?</button>
      <div class="answer"><p>Standard: 5-7 business days.</p><input placeholder="Type a follow-up question"></div>
    </div>
    <div class="faq-item">
      <button class="question">Do you ship internationally?</button>
      <div class="answer"><p>Yes — select countries supported at checkout.</p><input placeholder="Type a follow-up question"></div>
    </div>
    <div class="faq-item">
      <button class="question">How to contact support?</button>
      <div class="answer"><p>Email support@example.com or call 1800-000.</p><input placeholder="Type a follow-up question"></div>
    </div>
    <div class="faq-item">
      <button class="question">Are discounts stackable?</button>
      <div class="answer"><p>Only one promotional code can be applied.</p><input placeholder="Type a follow-up question"></div>
    </div>
  </section>
</main>
<footer><small>Q3 — Interactive FAQ demo</small></footer>
</body>
</html>
