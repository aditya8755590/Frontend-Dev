<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diprella Login</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <section class="main">
        <section class="login">

            <nav>
                <img src="pngwing 1.png" class="logo" alt="">
                <p class="brand">Diprella</p>
            </nav>

            <main class="content">
                <p>Sign in to Diprella</p>

                <div class="support">
                    <div class="circle">
                         <img src="Vector.png" alt="">
                    </div>
                    <div class="circle">
                         <img src="Vector-2.png" alt="">
                    </div>
                    <div class="circle">
                         <img src="Vector-3.png" alt="">
                    </div>
                   
                </div>

                    <input type="email" placeholder="Email" class="input-email">
                    <input type="password" placeholder="Password" class="input-password">

                <h2>Forget your Password?</h2>
                <button class="sign">SIGN IN</button>
            </main>

        </section>

        <section class="welcome-back white">
            <p>Hello,Friends</p>
            <h3>Enter your personal details and start journey with us.</h3>
            <button class="sign-in" onclick="window.location.href='index2.html' ">SIGN UP</button>

            <div class="icons">
                <img  id="gola"src="Ellipse 1.png" alt="">
                <img  id="polygon"src="Polygon 1.png" alt="">
            </div>
        </section>

    </section>
</body>
</html>
